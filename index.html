<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Atelier des archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Caveat:wght@500;600&family=Courier+Prime:wght@400;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout : bandeau de progression ; dossier d'archives à gauche (document + fiche de catalogue), table de travail à droite ; une colonne sur téléphone. */
:root{
  --bg:#e6e9e4;          /* carton d'archives gris-vert */
  --paper:#fbfaf6;
  --paper-2:#f1efe7;
  --ink:#1d2433;         /* encre bleu-noir */
  --ink-soft:#4f5767;
  --line:#c9cdc4;
  --wax:#9b1d2a;         /* cire à cacheter */
  --wax-hi:#c9384a;
  --tag:#e9cf7a;         /* étiquette kraft-jaune */
  --ok:#2f6b47; --ok-bg:#dcebdf;
  --no:#9b1d2a; --no-bg:#f4dfe0;
  --f-ui:"Archivo",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,serif;
  --f-hand:"Caveat","Segoe Print",cursive;
  --f-type:"Courier Prime","Courier New",monospace;
  --f-press:"Old Standard TT",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a22;--paper:#22283280;--paper:#232a35;--paper-2:#1c222c;--ink:#e9e6dc;--ink-soft:#a9adb6;--line:#38404d;
  --wax:#d6505f;--wax-hi:#f07280;--tag:#c9ad57;--ok:#7fc79a;--ok-bg:#1f3428;--no:#f08a95;--no-bg:#3a2226;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a22;--paper:#232a35;--paper-2:#1c222c;--ink:#e9e6dc;--ink-soft:#a9adb6;--line:#38404d;
  --wax:#d6505f;--wax-hi:#f07280;--tag:#c9ad57;--ok:#7fc79a;--ok-bg:#1f3428;--no:#f08a95;--no-bg:#3a2226;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--wax);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* Bandeau */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--wax);display:inline-block}
.track{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);border-radius:3px;color:var(--ink-soft)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done{color:var(--ink);border-color:var(--ink-soft)}
.score{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.score b{font-size:20px;color:var(--wax)}

/* Accueil */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.hero h1{font-stretch:68%;font-weight:800;font-size:clamp(40px,7vw,78px);line-height:.92;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 span{color:var(--wax)}
.lead{font-family:var(--f-read);font-size:19px;max-width:58ch;color:var(--ink)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:15px}
.rules li::before{content:counter(r);font-weight:800;font-stretch:75%;font-size:22px;color:var(--wax);line-height:1.1}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:12px 22px;font-weight:700;letter-spacing:.03em;font-size:16px}
.btn:hover{background:var(--wax)}
.btn[disabled]{opacity:.35;cursor:not-allowed;background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.seals-demo{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
details.prof{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
details.prof summary{cursor:pointer;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.prof table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px;font-variant-numeric:tabular-nums}
.prof td{border-top:1px solid var(--line);padding:6px 8px 6px 0;vertical-align:top}
.prof td:first-child{white-space:nowrap;font-weight:700;width:90px}
.prof p,.prof ul{font-size:14px;max-width:70ch}
.tablewrap{overflow-x:auto}

/* Plan de travail */
.desk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.docs{display:grid;gap:18px}
.sheet{background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 10px 24px -18px #0006;position:relative}
.sheet .cote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);padding:10px 18px;border-bottom:1px dashed var(--line)}
.text{padding:22px 26px 26px;white-space:pre-line;min-width:0}
.text.hand{font-family:var(--f-hand);font-size:25px;line-height:1.35}
.text.type{font-family:var(--f-type);font-size:15.5px;line-height:1.6}
.text.press{font-family:var(--f-press);font-size:17px;line-height:1.55;column-gap:28px}
.text.press .head{display:block;font-weight:700;font-size:30px;line-height:1.05;text-align:center;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:12px;letter-spacing:.02em}
/* documents iconographiques */
.fig{margin:0;padding:18px 18px 14px;display:grid;gap:10px}
.fig svg{display:block;width:100%;height:auto;max-width:100%;border:1px solid var(--line)}
.fig.poster svg{max-width:330px;margin:0 auto;box-shadow:0 8px 20px -14px #0008}
.fig figcaption{font-family:var(--f-read);font-size:14.5px;line-height:1.45;color:var(--ink-soft)}
.fig img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#111}
.fig.poster img{max-width:360px;margin:0 auto}
.fig .credit{display:block;margin-top:6px;font-family:var(--f-ui);font-size:11.5px;color:var(--ink-soft)}
.fig figcaption b{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-right:6px}
.kind{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:3px;background:var(--tag);color:#1d2433}
.routes{display:flex;gap:12px;flex-wrap:wrap}
.route{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:4px;max-width:280px}
.route:hover{border-color:var(--ink)}
.route b{font-size:17px}
.route span{font-size:13.5px;color:var(--ink-soft)}
.route.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.route.main span{color:var(--bg);opacity:.8}
.route.main:hover{background:var(--wax);border-color:var(--wax)}
/* fausse messagerie */
.chat{margin:20px auto;max-width:380px;border:1px solid var(--line);border-radius:18px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper-2)}
.chat-h{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.chat-h b{display:block;font-size:15px}.chat-h small{color:var(--ok);font-size:12px}
.chat-b{display:flex;flex-direction:column;gap:8px;padding:14px}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;font-size:15.5px;line-height:1.35;background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:#2f7bf6;color:#fff;border-color:#2f7bf6;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.chat-f{padding:8px 14px;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line);background:var(--paper)}
/* faux post */
.post{margin:20px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;gap:10px}
.post-h{display:flex;gap:10px;align-items:center}
.post-h b{display:block;font-size:15px}.post-h small{color:var(--ink-soft);font-size:13px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#c9a43a,#9b1d2a)}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;vertical-align:1px}
.post p{margin:0;font-size:17px;line-height:1.45}
.post-s{color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line);padding-top:8px}
/* niveaux */
.rank{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:4px 12px 4px 4px;border:1.5px solid var(--ink);border-radius:999px}
.rank .lv{width:24px;height:24px;border-radius:50%;background:var(--wax);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.levelup{border:2px dashed var(--wax);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--wax) 8%,var(--paper))}
.stamp{font-stretch:70%;font-weight:800;text-transform:uppercase;color:var(--wax);border:3px solid var(--wax);padding:4px 8px;transform:rotate(-8deg);font-size:14px;letter-spacing:.06em;animation:stamp .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.levelup b{display:block;font-size:17px}
.levelup span{font-size:14px;color:var(--ink-soft)}
.streak{font-size:13px;font-weight:700;color:var(--ok)}
.ladder{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ladder li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14px}
.ladder li .lv{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--wax);color:var(--wax);display:grid;place-items:center;font-size:12px;font-weight:800}
.ladder li.got .lv{background:var(--wax);color:#fff}
.ladder li small{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bigrank{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigrank .stamp{font-size:clamp(20px,4vw,30px);padding:8px 14px;border-width:4px}
/* fiche catalogue */
.card{border-top:1px solid var(--line);background:var(--paper-2);display:grid;grid-template-columns:1fr 1fr}
.field{padding:10px 18px;border-top:1px solid var(--line);min-width:0}
.field:nth-child(odd){border-right:1px solid var(--line)}
.field:nth-child(-n+2){border-top:0}
.field small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
.field p{margin:2px 0 0;font-family:var(--f-read);font-size:14.5px;line-height:1.4}
.field .blank{display:block;height:12px;margin-top:6px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);opacity:.8}
.field.fresh p{animation:ink .7s ease-out}
@keyframes ink{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}

/* Panneau */
.panel{background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.step{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--wax)}
.panel h2{font-stretch:80%;font-weight:800;font-size:26px;line-height:1.1}
.panel p.help{margin:0;color:var(--ink-soft);font-size:15px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:5px;padding:11px 13px;font-size:15px;line-height:1.4;display:grid;grid-template-columns:24px 1fr;gap:8px}
.opt .l{font-weight:800;color:var(--ink-soft)}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--paper-2)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--no);background:var(--no-bg)}
.opt.was::after{content:"Ta 1re impression";grid-column:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.opt[disabled]{cursor:default}

/* Sceaux */
.seals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.seal{background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.wax{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 55%,color-mix(in srgb,var(--wax) 70%,#000) 100%);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--wax) 35%,transparent),inset 0 -3px 6px #0004;color:#fff;font-weight:800;font-stretch:70%;font-size:26px;transition:transform .15s}
.seal:hover .wax{transform:rotate(-8deg) scale(1.05)}
.seal span.n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.seal.open .wax{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink-soft);animation:crack .45s ease-out}
.seal.open .wax::after{content:"✓";font-size:22px;color:var(--ok)}
.seal.open .wax b{display:none}
@keyframes crack{0%{transform:scale(1)}40%{transform:scale(1.2) rotate(12deg);box-shadow:0 0 0 10px color-mix(in srgb,var(--wax) 25%,transparent)}100%{transform:scale(1)}}

.verdict{border-left:4px solid var(--ink);padding:4px 0 4px 14px;font-family:var(--f-read);font-size:15.5px}
.verdict.ok{border-color:var(--ok)}.verdict.ko{border-color:var(--no)}
.verdict h3{font-family:var(--f-ui);font-size:15px;font-weight:800;margin-bottom:4px}
.verdict p{margin:0 0 8px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba div{background:var(--paper-2);border:1px solid var(--line);padding:10px 12px;font-size:14px;font-family:var(--f-read)}
.ba small{display:block;font-family:var(--f-ui);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--ink-soft);margin-bottom:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pts{font-weight:800;color:var(--wax);font-variant-numeric:tabular-nums}

/* Bilan */
.final{display:grid;gap:22px}
.final h1{font-stretch:68%;font-weight:800;font-size:clamp(36px,6vw,64px);text-transform:uppercase;line-height:.95}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-stretch:70%;font-weight:800;font-size:48px;line-height:1;color:var(--wax);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.method{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mcard{background:var(--paper);border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:52px 1fr;gap:12px}
.mcard .wax{width:44px;height:44px;font-size:19px;box-shadow:none}
.mcard h3{font-size:16px;font-weight:800}
.mcard p{margin:4px 0 0;font-family:var(--f-read);font-size:15px}
.moral{font-family:var(--f-read);font-size:20px;max-width:60ch;border-top:2px solid var(--ink);padding-top:14px}
.note{font-size:12.5px;color:var(--ink-soft);max-width:80ch}

@media (max-width:820px){
  .hero,.desk{grid-template-columns:1fr}
  .panel{position:static}
  .method{grid-template-columns:1fr}
}
@media (max-width:480px){
  .card{grid-template-columns:1fr}
  .field:nth-child(odd){border-right:0}
  .field:nth-child(2){border-top:1px solid var(--line)}
  .text{padding:18px}
  .text.hand{font-size:22px}
  .wax{width:52px;height:52px;font-size:22px}
  .ba{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<div class="wrap" id="app"></div>

<script>
const TAGS = {
  nature:{l:"N",nom:"Nature",q:"Qu'est-ce que c'est ?"},
  auteur:{l:"A",nom:"Auteur",q:"Qui l'a produit ?"},

  destinataire:{l:"D",nom:"Destinataire",q:"Pour qui ?"}
};
const ORDER = ["nature","auteur","contexte","destinataire"];

/*IMG*/const IMG={photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/2-8-14%2C_mobilisation%2C_le_premier_d%C3%A9part%2C_gare_de_l%27Est_-_btv1b69310801.jpg/960px-2-8-14%2C_mobilisation%2C_le_premier_d%C3%A9part%2C_gare_de_l%27Est_-_btv1b69310801.jpg",caricature:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/A_faut_esperer_q%27eu_se_jeu_la_Finira_bentot_sic%2C_G.23829.jpg/960px-A_faut_esperer_q%27eu_se_jeu_la_Finira_bentot_sic%2C_G.23829.jpg",monument:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Verdun-sur-Garonne_-_Monument_aux_Morts.jpg/960px-Verdun-sur-Garonne_-_Monument_aux_Morts.jpg",vichy:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Imagerie_de_la_R%C3%A9volution_nationale.jpg/960px-Imagerie_de_la_R%C3%A9volution_nationale.jpg",liberte:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Eug%C3%A8ne_Delacroix_-_La_libert%C3%A9_guidant_le_peuple-2.jpg/960px-Eug%C3%A8ne_Delacroix_-_La_libert%C3%A9_guidant_le_peuple-2.jpg",louis14:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Rigaud_Louis_XIV_1701.jpg/960px-Rigaud_Louis_XIV_1701.jpg",mur:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/DF-ST-91-01459_East_German_policemen_look_over_into_West_Germany_as_they_stand_near_the_Brandenburg_Gate.jpeg/960px-DF-ST-91-01459_East_German_policemen_look_over_into_West_Germany_as_they_stand_near_the_Brandenburg_Gate.jpeg"};/*/IMG*/
/* ---------- dossiers ---------- */
const CASES = [
{
  id:"lettre", titre:"La lettre du front", theme:"Première Guerre mondiale", kind:"Texte",
  docs:[{style:"hand", cote:"Lettre manuscrite",
    texte:`Ma chère maman,

Ne te fais pas de souci pour moi. Ici tout va bien : on mange à notre faim, le cuistot nous gâte et on dort au sec dans un bon abri. Les copains sont gais et le moral est excellent. Les Boches n'osent plus bouger.

Embrasse bien papa et la petite Jeanne.
Ton fils qui t'aime,
Louis`,
    tags:{

  question:"Que peut-on tirer de ce document ?",
  options:{
    a:"La lettre montre que, malgré la guerre, les soldats du front étaient bien nourris, logés à l'abri et gardaient le moral.",
    b:"Louis veut surtout rassurer sa mère : la lettre éclaire ses liens familiaux et l'autocensure plus que la vie réelle au front.",
    c:"Écrite au cœur des combats, la lettre prouve que l'armée française dominait alors l'ennemi.",
    d:"Le soldat ment sur ses conditions de vie : la lettre est inutilisable et l'historien doit l'écarter."
  },
  correct:"b", key:"destinataire",

const ROUTES = {
  express:{nom:"Parcours 30 minutes", desc:"6 dossiers tirés au sort.", per:1, imgs:2},
  complet:{nom:"Parcours complet", desc:"10 dossiers tirés au sort. Environ 50 minutes.", per:2, imgs:4}
};
const keysOf = c => [].concat(c.key);
const isImg = c => c.docs[0].style==="img";
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function loadSeen(){ try{ return new Set(JSON.parse(localStorage.getItem("atelier-vus")||"[]")); }catch(e){ return new Set(); } }
function saveSeen(set){ try{ localStorage.setItem("atelier-vus", JSON.stringify([...set])); }catch(e){} }
function draw(route){
  const R0 = ROUTES[route]; let seen = loadSeen();
  const main = CASES.filter(c=>!c.duo && !c.fake);
  const fresh = pool => { const f = pool.filter(c=>!seen.has(c.id)); return shuffle(f).concat(shuffle(pool.filter(c=>seen.has(c.id)))); };
  let best=null, bestImg=-1;
  for(let t=0;t<40;t++){
    let pick=[];
    ORDER.forEach(k=>{ const pool=main.filter(c=>c.key===k); pick.push(...fresh(pool).slice(0,R0.per)); });
    const n = pick.filter(isImg).length;
    if(n>bestImg){best=pick;bestImg=n;} if(n>=R0.imgs) break;
  }
  const fake = shuffle(CASES.filter(c=>c.fake))[0];
  const duo = fresh(CASES.filter(c=>c.duo))[0];
  const ordered = shuffle(best);
  ordered.splice(1+Math.floor(Math.random()*(ordered.length-1)),0,fake);
  const chosen = [...ordered, duo];
  chosen.forEach(c=>seen.add(c.id));
  if(main.every(c=>seen.has(c.id))) seen = new Set(chosen.map(c=>c.id));
  saveSeen(seen);
  return chosen.map(c=>CASES.indexOf(c));
}

const METHOD = {
  nature:"Lettre, rapport, journal intime, article, photo, caricature, affiche, statue ? Public ou privé, libre ou censuré ? La nature dit ce que le document peut montrer.",
  auteur:"Qui l'a écrit, dessiné, photographié ou commandé ? Depuis quelle place, avec quels intérêts ? L'auteur donne le point de vue, et parfois les raisons de déformer.",
  contexte:"Quand, où, que se passe-t-il alors, et que sait-on de la suite ? Le contexte donne le sens du document et rappelle ce qu'il ne montre pas.",
  destinataire:"À qui s'adresse-t-on, pour obtenir quoi ? Le destinataire explique ce qu'on dit, ce qu'on tait, ce qu'on embellit."
};

/* ---------- niveaux de maîtrise ---------- */
const RANKS = [
  {min:0,   nom:"Petite souris des archives", txt:"Tu grignotes tes premiers cartons."},
  {min:.2,  nom:"Taupe des réserves",        txt:"Tu creuses sous la surface des documents."},
  {min:.4,  nom:"Fine loupe",                txt:"Plus aucun détail de la fiche ne t'échappe."},
  {min:.6,  nom:"Œil de lynx",               txt:"Tu repères les pièges avant d'y tomber."},
  {min:.8,  nom:"Sphinx des sources",        txt:"Les documents te livrent leurs secrets."},
  {min:.95, nom:"Légende des archives",      txt:"Ton nom sera gravé sur les rayonnages."}
];
const rankIdx = (score, max) => { let r=0; RANKS.forEach((k,i)=>{ if(score >= Math.ceil(k.min*max)) r=i; }); return r; };
const rankBadge = () => { const i=rankIdx(S.score,maxScore()); return `<span class="rank" title="Niveau de maîtrise"><span class="lv">${i+1}</span>${RANKS[i].nom}</span>`; };

/* ---------- état ---------- */
const fresh = () => ({list:[], streak:0, levelUp:null, screen:"intro", route:"express", pos:0, step:"blind", first:null, second:null, keyPick:null, opened:[], fresh:null, score:0, changed:0, results:[]});
let S = fresh();
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = () => S.list;
const cur = () => CASES[list()[S.pos]];
const maxScore = () => list().length*5;
const nMain = () => list().filter(i=>!CASES[i].duo).length;

function startCase(pos){
  const c = CASES[list()[pos]];
  Object.assign(S, {order: shuffle(Object.keys(c.options)), screen:"case", pos, first:null, second:null, keyPick:null, fresh:null,
       step: c.duo ? "second" : "blind", opened: c.duo ? [...ORDER] : []});
  render(); scrollTo({top:0,behavior:"smooth"});
}

/* ---------- rendu ---------- */
function header(){
  const chips = S.screen==="intro" ? "" : list().map((i,k)=>{
    const cls = S.screen==="case" && k===S.pos ? "on" : (S.results[k] ? "done" : "");
    return `<span class="chip ${cls}">${CASES[i].duo ? "Duel" : CASES[i].fake ? "?" : k+1}</span>`;
  }).join("");
  return `<header class="top">
    <div class="brand"><i></i>L'Atelier des archives</div>
    <div class="track">${chips}</div>
    ${S.screen==="intro" ? "" : `<div class="row">${rankBadge()}<div class="score">Score <b>${S.score}</b> / ${maxScore()}</div></div>`}
  </header>`;
}

function intro(){
  const demo = ORDER.map(k=>`<div class="seal"><div class="wax"><b>${TAGS[k].l}</b></div><span class="n">${TAGS[k].nom}</span></div>`).join("");
  const routes = Object.entries(ROUTES).map(([k,r])=>`<button class="route ${k==="express"?"main":""}" data-route="${k}"><b>${r.nom}</b><span>${r.desc}</span></button>`).join("");
  return `${header()}
  <section class="hero">
    <div style="display:grid;gap:18px">
      <h1>Un document<br>ne parle <span>jamais seul</span></h1>
      <p class="lead">Aux archives, historiennes et historiens ne se contentent pas de lire un texte ou de regarder une image : ils et elles cherchent d'abord à savoir ce qu'est le document, qui l'a produit, quand, et pour qui.</p>
      <p class="lead">C'est maintenant ton enquête. Dans chaque dossier, l'identité du document est cachée sous quatre sceaux de cire. Lettre, photo, affiche, caricature ou statue : lis ou observe-le d'abord sans rien savoir, puis brise les sceaux. Ta lecture va-t-elle changer ?</p>
      <div class="routes">${routes}</div>
    </div>
    <div style="display:grid;gap:14px">
      <ol class="rules">
        <li><span><b>Première impression.</b> Lis ou observe le document seul et choisis ce qu'il t'apprend. Pas de points à cette étape.</span></li>
        <li><span><b>Brise les quatre sceaux.</b> Chacun révèle une information sur le document.</span></li>
        <li><span><b>Seconde lecture.</b> Réponds à nouveau : <span class="pts">+3 points</span> si ta conclusion est juste.</span></li>
        <li><span><b>Quel sceau a tout changé ?</b> Désigne l'information décisive : <span class="pts">+2 points</span>.</span></li>
      </ol>
      <div class="seals-demo">${demo}</div>
      <div style="display:grid;gap:8px;margin-top:6px">
        <div class="step">Six niveaux de maîtrise à gagner</div>
        <ol class="ladder">${RANKS.map((r,i)=>`<li class="${i===0?"got":""}"><span class="lv">${i+1}</span><span><b>${r.nom}</b></span></li>`).join("")}</ol>
      </div>
    </div>
  </section>
`;
}

function docSheet(d, opened){
  let body;
  if(d.style==="img"){
    const pic = d.src ? `<img src="${IMG[d.src]}" alt="${esc(d.legende)}" loading="lazy">` : d.svg();
    body = `<figure class="fig ${d.poster?"poster":""}">${pic}<figcaption><b>Ce que l'on voit</b>${esc(d.legende)}${d.credit?`<span class="credit">${esc(d.credit)}</span>`:""}</figcaption></figure>`;
  } else if(d.style==="chat"){
    const q=d.chat;
    body = `<div class="chat"><div class="chat-h"><span class="ava">L</span><div><b>${esc(q.contact)}</b><small>${esc(q.sub)}</small></div></div><div class="chat-b">${q.msgs.map(m=>`<div class="bub ${m.me?"me":""}">${esc(m.t)}</div>`).join("")}</div><div class="chat-f">${esc(q.vues)}</div></div>`;
  } else if(d.style==="post"){
    const q=d.post;
    body = `<div class="post"><div class="post-h"><span class="ava">C</span><div><b>${esc(q.nom)} <span class="tick" aria-label="certifié">✔</span></b><small>${esc(q.pseudo)} · ${esc(q.date)}</small></div></div><p>${esc(q.texte)}</p><small class="post-s">${esc(q.stats)}</small></div>`;
  } else {
    const t = d.style==="press" ? `<span class="head">${esc(d.head)}</span>${esc(d.texte)}` : esc(d.texte);
    body = `<div class="text ${d.style}">${t}</div>`;
  }
  const fields = ORDER.map(k=>{
    const show = opened.includes(k);
    return `<div class="field ${S.fresh===k?'fresh':''}"><small>${TAGS[k].nom}</small>${show?`<p>${esc(d.tags[k])}</p>`:`<span class="blank" aria-label="Scellé"></span>`}</div>`;
  }).join("");
  return `<article class="sheet">
    <div class="cote"><span>${esc(d.cote)}</span><span>${d.src?"Document d'archives":d.style==="img"?"Image reconstituée":"Document reconstitué"}</span></div>
    ${body}
    <div class="card">${fields}</div>
  </article>`;
}

const L = k => "ABCD"[S.order.indexOf(k)] || "?";
function opts(c, picked, lockedResult){
  if(!S.order || S.order.length!==Object.keys(c.options).length) S.order = shuffle(Object.keys(c.options));
  return `<div class="opts">${S.order.map(k=>{ const v=c.options[k];
    let cls = "";
    if(lockedResult){ if(k===c.correct) cls="good"; else if(k===picked) cls="bad"; }
    else if(k===picked) cls="sel";
    if(S.step!=="blind" && !c.duo && k===S.first && !lockedResult) cls += " was";
    return `<button class="opt ${cls}" data-opt="${k}" ${lockedResult?"disabled":""}><span class="l">${L(k)}</span><span>${esc(v)}</span></button>`;
  }).join("")}</div>`;
}

function panel(){
  const c = cur();
  const n = c.duo ? "Face-à-face" : `Dossier ${S.pos+1} sur ${nMain()}`;
  const isImg = c.docs[0].style==="img";
  if(S.step==="blind") return `
    <div class="step">${n} · Étape 1 · Première impression</div>
    <h2>${esc(c.question)}</h2>
    <p class="help">Tu ne sais rien de ce document à part ce que tu ${isImg?"vois":"lis"}. Fie-toi à ta première impression.</p>
    ${opts(c, S.first)}
    <button class="btn" data-go="toReveal" ${S.first?"":"disabled"}>Valider ma première impression</button>`;

  if(S.step==="reveal"){
    const seals = ORDER.map(k=>{
      const o = S.opened.includes(k);
      return `<button class="seal ${o?"open":""}" data-seal="${k}" ${o?"disabled":""} aria-label="Briser le sceau ${TAGS[k].nom}"><div class="wax"><b>${TAGS[k].l}</b></div><span class="n">${TAGS[k].nom}</span></button>`;
    }).join("");
    const left = 4 - S.opened.length;
    return `
    <div class="step">${n} · Étape 2 · Briser les sceaux</div>
    <h2>Découvre l'identité du document</h2>
    <p class="help">Clique sur chaque sceau, dans l'ordre que tu veux. Les informations s'inscrivent sur la fiche sous le document.</p>
    <div class="seals">${seals}</div>
    <button class="btn" data-go="toSecond" ${left?"disabled":""}>${left?`Encore ${left} sceau${left>1?"x":""} à briser`:"Revenir au document"}</button>`;
  }

  if(S.step==="second") return `
    <div class="step">${n} · ${c.duo?"Étape 1 · Confronter":"Étape 3 · Seconde lecture"}</div>
    <h2>${esc(c.question)}</h2>
    <p class="help">${c.duo ? esc(c.help) : "Maintenant que tu connais l'identité du document, garde ta réponse ou change-la."}</p>
    ${opts(c, S.second)}
    <button class="btn" data-go="toKey" ${S.second?"":"disabled"}>Valider</button>`;

  if(S.step==="key"){
    const ok = S.second===c.correct;
    const keys = ORDER.map(k=>`<button class="opt ${S.keyPick===k?"sel":""}" data-key="${k}"><span class="l">${TAGS[k].l}</span><span><b>${TAGS[k].nom}</b> · ${TAGS[k].q}</span></button>`).join("");
    return `
    <div class="step">${n} · ${c.duo?"Étape 2":"Étape 4"} · L'information décisive</div>
    <div class="verdict ${ok?"ok":"ko"}"><h3>${ok?"Bonne conclusion · <span class='pts'>+3</span>":"Ce n'est pas la meilleure conclusion"}</h3><p>${ok?"Tu as su lire le document avec son identité.":"La bonne réponse est la "+L(c.correct)+". L'explication arrive juste après."}</p></div>
    <h2>${c.duo ? "Quel élément explique la différence entre les deux récits ?" : "Quel sceau a le plus changé ce que le document peut nous apprendre ?"}</h2>
    <div class="opts">${keys}</div>
    <button class="btn" data-go="toDebrief" ${S.keyPick?"":"disabled"}>Voir l'explication</button>`;
  }

  if(S.step==="debrief"){
    const r = S.results[S.pos];
    const last = S.pos===list().length-1;
    return `
    <div class="step">${n} · Explication · <span class="pts">${r.pts} / 5 points</span></div>
    ${S.levelUp!==null ? `<div class="levelup"><span class="stamp">Niveau ${S.levelUp+1}</span><div><b>Tu deviens ${RANKS[S.levelUp].nom} !</b><span>${RANKS[S.levelUp].txt}</span></div></div>` : ""}
    ${S.streak>=2 ? `<div class="streak">Série parfaite : ${S.streak} dossiers à 5 sur 5 d'affilée</div>` : ""}
    <h2>${keysOf(c).map(k=>TAGS[k].nom).join(", ")} : ${keysOf(c).length>1?"les sceaux décisifs":"le sceau décisif"}</h2>
    <div class="ba">
      <div><small>Sans les sceaux</small>${esc(c.avant)}</div>
      <div><small>Avec les sceaux</small>${esc(c.apres)}</div>
    </div>
    <div class="verdict ${r.keyOk?"ok":"ko"}">
      <h3>${r.keyOk?"Bien vu · <span class='pts'>+2</span>":"Ton choix : "+TAGS[S.keyPick].nom}</h3>
      <p>${esc(c.expl)}</p>
      ${!c.duo ? `<p><b>${S.first===c.correct?"Ta première impression était déjà la bonne : tu as su te méfier du document seul.":"Ta première impression était la "+L(S.first)+". Les sceaux ont changé la valeur du document."}</b></p>`:""}
    </div>
    <button class="btn" data-go="${last?"final":"next"}">${last?"Voir mon bilan":"Dossier suivant"}</button>`;
  }
}

function caseView(){
  const c = cur();
  return `${header()}
  <div style="display:grid;gap:4px"><div class="row"><span class="kind">${esc(c.kind)}</span><span class="step" style="color:var(--ink-soft)">${esc(c.theme)}</span></div><h2 style="font-stretch:75%;font-weight:800;font-size:clamp(26px,4vw,38px);text-transform:uppercase">${esc(c.titre)}</h2></div>
  <section class="desk">
    <div class="docs">${c.docs.map(d=>docSheet(d,S.opened)).join("")}</div>
    <aside class="panel">${panel()}</aside>
  </section>`;
}

function finalView(){
  const played = list().map(i=>CASES[i]);
  const cards = ORDER.map(k=>{
    const where = played.map((c,p)=>keysOf(c).includes(k)?(c.duo?"face-à-face":c.fake?"document piège":"dossier "+(p+1)):null).filter(Boolean);
    return `<div class="mcard"><div class="wax"><b>${TAGS[k].l}</b></div><div><h3>${TAGS[k].nom} · ${TAGS[k].q}</h3><p>${esc(METHOD[k])}</p>${where.length?`<p class="note">Décisif : ${where.join(", ")}.</p>`:""}</div></div>`;
  }).join("");
  const goodFirst = S.results.filter((r,p)=>r && !played[p].duo && r.first===played[p].correct).length;
  return `${header()}
  <section class="final">
    <div class="step">Bilan de l'enquête</div>
    <h1>Avant d'interroger un document,<br>brise ses quatre sceaux</h1>
    <div class="bigrank"><span class="stamp">${RANKS[rankIdx(S.score,maxScore())].nom}</span><span class="lead" style="font-size:17px">${RANKS[rankIdx(S.score,maxScore())].txt}</span></div>
    <div class="stats">
      <div class="stat"><b>${S.score}<small style="font-size:22px">/${maxScore()}</small></b><span>Points</span></div>
      <div class="stat"><b>${S.changed}</b><span>Fois où tu as changé d'avis</span></div>
      <div class="stat"><b>${goodFirst}/${nMain()}</b><span>Bonnes premières impressions</span></div>
    </div>
    <p class="moral">Un même texte, une même image n'apprennent pas la même chose selon qui les produit, pour qui, sous quelle forme et à quel moment. Un document qui embellit, exagère ou ment n'est pas inutile : il répond à une autre question.</p>
    <h2 style="font-stretch:80%;font-weight:800;font-size:24px">Fiche méthode : les quatre questions à poser</h2>
    <div class="method">${cards}</div>
    <ol class="ladder" style="max-width:420px">${RANKS.map((r,i)=>`<li class="${i<=rankIdx(S.score,maxScore())?"got":""}"><span class="lv">${i+1}</span><span><b>${r.nom}</b></span><small>${Math.ceil(r.min*maxScore())} pts</small></li>`).join("")}</ol>
    <div class="row">
      ${S.route==="express"?`<button class="btn" data-go="complet">Continuer avec le parcours complet</button>`:""}
      <button class="btn ghost" data-go="again">Rejouer avec d'autres documents</button>
      <button class="btn ghost" data-go="restart">Revenir à l'accueil</button>
    </div>
  </section>`;
}

function render(){
  $app.innerHTML = S.screen==="intro" ? intro() : S.screen==="final" ? finalView() : caseView();
}

/* ---------- interactions ---------- */
$app.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  const c = S.screen==="case" ? cur() : null;
  if(t.dataset.route){ const r=t.dataset.route; S=fresh(); S.route=r; S.list=draw(r); return startCase(0); }
  if(t.dataset.opt){
    if(S.step==="blind") S.first = t.dataset.opt;
    else if(S.step==="second") S.second = t.dataset.opt;
    return render();
  }
  if(t.dataset.seal){
    if(!S.opened.includes(t.dataset.seal)) S.opened.push(t.dataset.seal);
    S.fresh = t.dataset.seal; return render();
  }
  if(t.dataset.key){ S.keyPick = t.dataset.key; return render(); }
  switch(t.dataset.go){
    case "toReveal": S.step="reveal"; return render();
    case "toSecond": S.step="second"; S.fresh=null; return render();
    case "toKey": S.step="key"; return render();
    case "toDebrief": {
      const ansOk = S.second===c.correct, keyOk = keysOf(c).includes(S.keyPick);
      const pts = (ansOk?3:0)+(keyOk?2:0);
      const before = rankIdx(S.score, maxScore());
      S.score += pts;
      const after = rankIdx(S.score, maxScore());
      S.levelUp = after>before ? after : null;
      S.streak = pts===5 ? S.streak+1 : 0;
      if(!c.duo && S.first!==S.second) S.changed++;
      S.results[S.pos] = {pts, keyOk, first:S.first, second:S.second};
      S.step="debrief"; return render();
    }
    case "next": return startCase(S.pos+1);
    case "final": S.screen="final"; render(); return scrollTo({top:0,behavior:"smooth"});
    case "complet": S=fresh(); S.route="complet"; S.list=draw("complet"); return startCase(0);
    case "again": { const r=S.route; S=fresh(); S.route=r; S.list=draw(r); return startCase(0); }
    case "restart": S = fresh(); render(); return scrollTo({top:0,behavior:"smooth"});
  }
});

/* conserve la partie si la page est mise à jour pendant le jeu */
window.claude?.hot?.snapshot?.(()=>S);
const boot = data => { if(data && data.screen && data.route) S = data; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
